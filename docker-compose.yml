services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_DB_DRIVER: postgres
      GATEWAY_DB_DSN: postgres://gateway:secret@postgres:5432/gateway?sslmode=disable
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY}
      GATEWAY_LOG_FORMAT: json
      GATEWAY_DEFAULT_PROVIDER: ${GATEWAY_DEFAULT_PROVIDER:-openai}
      GATEWAY_AUTH_TOKENS: ${GATEWAY_AUTH_TOKENS:-}
    restart: unless-stopped

volumes:
  pgdata:
